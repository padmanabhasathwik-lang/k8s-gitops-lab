apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcheck
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: netcheck
  template:
    metadata:
      labels:
        app: netcheck
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80